events {}

http {
    map $request_method $scrape_limit_key {
        default "";
        POST $binary_remote_addr;
    }

    limit_req_zone $scrape_limit_key zone=scrape_per_ip:10m rate=30r/m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Fast path: reverse-tunneled scraper that can reach Google directly
    # (compose network gateway :18081). Fallback local container is unused
    # while this upstream is healthy — see deploy/start-fast-egress-tunnel.sh
    upstream gmaps_fast {
        server 172.19.0.1:18081;
        keepalive 32;
    }

    server {
        listen 80;

        location = /scrape {
            limit_req zone=scrape_per_ip burst=10 nodelay;
            proxy_pass http://gmaps_fast;
            proxy_http_version 1.1;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location = /api/v1/jobs {
            limit_req zone=scrape_per_ip burst=10 nodelay;
            proxy_pass http://gmaps_fast;
            proxy_http_version 1.1;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://gmaps_fast;
            proxy_http_version 1.1;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
            proxy_connect_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }
    }
}
