services:
  scraper:
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        PLAYWRIGHT_DOWNLOAD_HOST: "${PLAYWRIGHT_DOWNLOAD_HOST:-}"
        APT_MIRROR: "${APT_MIRROR:-}"
    command:
      - "-web"
      - "-addr"
      - ":8080"
      - "-data-folder"
      - "/data"
    environment:
      GMS_WEB_CONCURRENCY: "${GMS_WEB_CONCURRENCY:-2}"
      GMS_WEB_BROWSER_POOL_SIZE: "${GMS_WEB_BROWSER_POOL_SIZE:-1}"
      GMS_WEB_PAGES_PER_BROWSER: "${GMS_WEB_PAGES_PER_BROWSER:-2}"
      DISABLE_TELEMETRY: "${DISABLE_TELEMETRY:-1}"
    volumes:
      - scraper-data:/data
    expose:
      - "8080"
    mem_limit: 1.5g
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - scraper
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  scraper-data:
