services:
  scraper:
    image: gosom/google-maps-scraper:latest
    command:
      - "-web"
      - "-addr"
      - ":8080"
      - "-data-folder"
      - "/data"
    environment:
      GMS_WEB_CONCURRENCY: "${GMS_WEB_CONCURRENCY:-4}"
      GMS_WEB_BROWSER_POOL_SIZE: "${GMS_WEB_BROWSER_POOL_SIZE:-2}"
      GMS_WEB_PAGES_PER_BROWSER: "${GMS_WEB_PAGES_PER_BROWSER:-4}"
      DISABLE_TELEMETRY: "${DISABLE_TELEMETRY:-1}"
    volumes:
      - scraper-data:/data
    expose:
      - "8080"
    mem_limit: 4g
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - scraper
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  scraper-data:
