name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            PROJECT_DIR="/home/ubuntu/gmaps"

            # 如果目录不是 git 仓库，重新 clone
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Directory is not a git repo, re-cloning..."
              rm -rf "$PROJECT_DIR"
              git clone --depth 1 --branch main "$REPO_URL" "$PROJECT_DIR"
            else
              cd "$PROJECT_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin
              git reset --hard origin/main
            fi

            cd "$PROJECT_DIR"

            # 配置 .env
            cat > .env << 'EOF'
            GOPROXY=https://goproxy.cn,direct
            PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
            EOF

            # 构建并启动（禁用缓存确保使用最新代码）
            sudo -E docker compose --env-file .env -f docker-compose.deploy.yaml build --no-cache
            sudo -E docker compose --env-file .env -f docker-compose.deploy.yaml up -d
            echo "Deploy completed at $(date)"
