name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/home/ubuntu/gmaps_new"
          rm: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 替换旧代码
            rm -rf /home/ubuntu/gmaps_old
            if [ -d "/home/ubuntu/gmaps" ]; then
              mv /home/ubuntu/gmaps /home/ubuntu/gmaps_old
            fi
            mv /home/ubuntu/gmaps_new /home/ubuntu/gmaps

            cd /home/ubuntu/gmaps

            # 配置 .env
            cat > .env << 'EOF'
            GOPROXY=https://goproxy.cn,direct
            PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
            EOF

            # 构建并启动
            sudo -E docker compose --env-file .env -f docker-compose.deploy.yaml build --no-cache
            sudo -E docker compose --env-file .env -f docker-compose.deploy.yaml up -d

            # 清理旧版本
            rm -rf /home/ubuntu/gmaps_old

            echo "Deploy completed at $(date)"
