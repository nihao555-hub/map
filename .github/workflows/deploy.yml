name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload code to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/home/ubuntu/gmaps_deploy"
          rm: false

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e

            echo "Step 1: Replace old code..."
            if [ -d "/home/ubuntu/gmaps" ]; then
              rm -rf /home/ubuntu/gmaps_old
              mv /home/ubuntu/gmaps /home/ubuntu/gmaps_old
            fi
            mv /home/ubuntu/gmaps_deploy /home/ubuntu/gmaps
            echo "Step 1 done"

            cd /home/ubuntu/gmaps

            echo "Step 2: Configure environment..."
            cat > .env << 'EOF'
            GOPROXY=https://goproxy.cn,direct
            PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
            EOF
            echo "Step 2 done"

            echo "Step 3: Build Docker image (takes 5-10 min)..."
            sudo -E docker compose --env-file .env -f docker-compose.deploy.yaml build --no-cache
            echo "Step 3 done"

            echo "Step 4: Start service..."
            sudo -E docker compose --env-file .env -f docker-compose.deploy.yaml up -d
            echo "Step 4 done"

            rm -rf /home/ubuntu/gmaps_old
            echo "=========================================="
            echo "  Deploy completed at $(date)"
            echo "=========================================="
