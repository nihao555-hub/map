<div id="results-modal" class="results-modal" role="dialog" aria-modal="true" aria-labelledby="results-modal-title" tabindex="-1" onclick="if(event.target===this)closeResults()">
    <div class="results-modal-content">
        <div class="results-modal-header">
            <div>
                <span class="eyebrow">抓取结果</span>
                <h2 id="results-modal-title">结果列表</h2>
            </div>
            <button type="button" class="modal-close" aria-label="关闭" onclick="closeResults()">&times;</button>
        </div>
        <div class="results-toolbar">
            <label class="results-search">
                <span class="sr-only">筛选结果</span>
                <input id="results-filter" type="search" placeholder="搜索名称或地址…" autocomplete="off">
            </label>
            <strong>共 {{len .}} 条</strong>
            <a class="button button-secondary" href="#" onclick="return downloadVisibleResults()">下载 CSV</a>
        </div>
        <div class="results-table-wrap">
            <table class="results-table">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>分类</th>
                        <th>地址</th>
                        <th>电话</th>
                        <th>网站</th>
                        <th class="numeric">评分</th>
                        <th class="numeric">评论数</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    {{range .}}
                    <tr class="result-row" data-search="{{.Title}} {{.Address}}">
                        <td title="{{.Title}}">{{.Title}}</td>
                        <td title="{{.Category}}">{{.Category}}</td>
                        <td title="{{.Address}}">{{.Address}}</td>
                        <td>{{if .Phone}}<a href="tel:{{.Phone}}">{{.Phone}}</a>{{end}}</td>
                        <td class="website-cell">{{if .Website}}<a href="{{.Website}}" target="_blank" rel="noopener noreferrer" title="{{.Website}}">{{.Website}}</a>{{end}}</td>
                        <td class="numeric">{{if .ReviewRating}}{{printf "%.1f" .ReviewRating}}{{end}}</td>
                        <td class="numeric">{{.ReviewCount}}</td>
                    </tr>
                    {{else}}
                    <tr><td colspan="7" class="empty-state">没有找到结果。</td></tr>
                    {{end}}
                </tbody>
            </table>
        </div>
        <button id="load-more-results" type="button" class="button button-secondary load-more-button">加载更多</button>
    </div>
    <script>
    (function () {
        var modal = document.getElementById('results-modal');
        var filter = document.getElementById('results-filter');
        var rows = Array.prototype.slice.call(document.querySelectorAll('.result-row'));
        var loadMore = document.getElementById('load-more-results');
        var pageSize = 50;
        var shown = pageSize;

        function updateRows() {
            var query = (filter.value || '').trim().toLowerCase();
            var matches = rows.filter(function (row) {
                return !query || row.dataset.search.toLowerCase().indexOf(query) !== -1;
            });

            rows.forEach(function (row) { row.hidden = true; });
            matches.slice(0, shown).forEach(function (row) { row.hidden = false; });
            loadMore.hidden = matches.length <= shown;
        }

        window.closeResults = function () {
            document.removeEventListener('keydown', onKeyDown);
            var container = document.getElementById('results-modal-container');
            if (container) container.innerHTML = '';
        };

        function onKeyDown(event) {
            if (event.key === 'Escape') closeResults();
        }

        window.downloadVisibleResults = function () {
            var rowsForDownload = rows.filter(function (row) { return !row.hidden; });
            var csv = ['名称,分类,地址,电话,网站,评分,评论数'];
            rowsForDownload.forEach(function (row) {
                var values = Array.prototype.slice.call(row.querySelectorAll('td')).map(function (cell) {
                    return '"' + cell.textContent.trim().replace(/"/g, '""') + '"';
                });
                csv.push(values.join(','));
            });
            var blob = new Blob(['\ufeff' + csv.join('\n')], {type: 'text/csv;charset=utf-8'});
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'results-filtered.csv';
            link.click();
            URL.revokeObjectURL(link.href);
            return false;
        };

        document.querySelectorAll('.website-cell a').forEach(function (link) {
            try { link.textContent = new URL(link.href).hostname; } catch (_) {}
        });
        filter.addEventListener('input', updateRows);
        loadMore.addEventListener('click', function () {
            shown += pageSize;
            updateRows();
        });
        document.addEventListener('keydown', onKeyDown);
        updateRows();
        setTimeout(function () { filter.focus(); }, 0);
    })();
    </script>
</div>
