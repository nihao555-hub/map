<div id="map-modal" class="map-modal" role="dialog" aria-modal="true" aria-labelledby="map-modal-title" onclick="if(event.target===this)closeJobMap()">
    <div class="map-modal-content">
        <div class="map-modal-header">
            <h2 id="map-modal-title">采集结果</h2>
            <button type="button" class="map-modal-close" aria-label="Close" onclick="closeJobMap()">&times;</button>
        </div>
        <div class="map-modal-body">
            <div id="job-places-list"></div>
            <div id="job-map"></div>
        </div>
    </div>
    <script>
    (function () {
        // Places/JobID/Status 必须由服务端 JSON 编码，否则有结果时脚本语法错误导致地图不初始化
        var places = {{ .PlacesJSON }};
        var JOB_ID = {{ .JobIDJSON }};
        var JOB_STATUS = {{ .StatusJSON }};

        var LEAFLET_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        var LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';

        // ensureLeaflet lazily loads Leaflet (CSS + JS) the first time the map
        // is opened, then invokes callback once it is available.
        function ensureLeaflet(callback) {
            if (window.L) {
                callback();
                return;
            }

            if (!document.getElementById('leaflet-css')) {
                var link = document.createElement('link');
                link.id = 'leaflet-css';
                link.rel = 'stylesheet';
                link.href = LEAFLET_CSS;
                document.head.appendChild(link);
            }

            var script = document.getElementById('leaflet-js');
            if (!script) {
                script = document.createElement('script');
                script.id = 'leaflet-js';
                script.src = LEAFLET_JS;
                document.head.appendChild(script);
            }

            script.addEventListener('load', callback);
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str == null ? '' : str;
            return div.innerHTML;
        }

        function refreshMapSize(map) {
            if (!map) return;
            // 弹窗刚插入 DOM 时尺寸常为 0，多次 invalidate 才能出瓦片
            [0, 50, 150, 300, 600].forEach(function (ms) {
                setTimeout(function () { map.invalidateSize({ pan: false }); }, ms);
            });
        }

        function createMap() {
            if (window.__jobMap) {
                window.__jobMap.remove();
            }

            var el = document.getElementById('job-map');
            if (!el) return null;

            // 标记图标走 cdnjs（CSP 已放行）；默认 unpkg 路径会被 img-src 拦掉
            if (L.Icon && L.Icon.Default) {
                L.Icon.Default.imagePath = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/';
            }

            // 必须先给 center/zoom，否则弹窗布局完成前 Leaflet 不发瓦片请求
            var map = L.map(el, {
                zoomControl: true,
                center: [20, 0],
                zoom: 2
            });
            // 与主界面一致：全球 Carto 底图（高德海外无图；OSM 官方瓦片易被拦）
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 20,
                attribution: '© OpenStreetMap © CARTO'
            }).addTo(map);

            window.__jobMap = map;
            refreshMapSize(map);
            return map;
        }

        function placePopup(place) {
            var parts = ['<strong>' + escapeHtml(place.title || '未命名商家') + '</strong>'];
            if (place.address) {
                parts.push(escapeHtml(place.address));
            }
            if (place.whatsapp) {
                parts.push('WhatsApp：' + escapeHtml(place.whatsapp));
            }
            if (place.emails) {
                parts.push('邮箱：' + escapeHtml(place.emails));
            }
            if (place.phone) {
                parts.push('电话：' + escapeHtml(place.phone));
            }
            if (place.review_rating) {
                parts.push('评分：★ ' + escapeHtml(String(place.review_rating)));
            }
            return parts.join('<br>');
        }

        function websiteCell(place) {
            if (place.website && /^https?:\/\//i.test(place.website)) {
                var host = place.website;
                try { host = new URL(place.website).hostname.replace(/^www\./, ''); } catch (e) {}
                return '<a href="' + encodeURI(place.website) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">' + escapeHtml(host) + '</a>';
            }
            return '<span class="cell-empty">—</span>';
        }

        function textCell(value) {
            if (value === null || value === undefined || value === '') {
                return '<span class="cell-empty">—</span>';
            }
            return escapeHtml(String(value));
        }

        // ============ 流式结果表格：初始渲染 + 运行中轮询增量追加 ============
        var map = null;
        var tbody = null;
        var markersLayer = null;
        var renderedCount = 0;
        var pollTimer = null;
        var statusPollCount = 0;
        var streamActive = (JOB_STATUS === 'working' || JOB_STATUS === 'pending');

        function rowHtml(place) {
            // 联系方式权重：WhatsApp > 邮箱 > 电话；社媒一并展示
            return '<td class="col-name">' + textCell(place.title) + '</td>' +
                '<td class="col-addr">' + textCell(place.address) + '</td>' +
                '<td class="col-wa">' + waCell(place) + '</td>' +
                '<td class="col-mail">' + textCell(place.emails) + '</td>' +
                '<td class="col-phone">' + textCell(place.phone) + '</td>' +
                '<td class="col-social">' + socialCell(place) + '</td>' +
                '<td class="col-rating">' + (place.review_rating ? '★ ' + escapeHtml(String(place.review_rating)) : '<span class="cell-empty">—</span>') + '</td>' +
                '<td class="col-reviews">' + (place.review_count ? escapeHtml(String(place.review_count)) : '<span class="cell-empty">—</span>') + '</td>' +
                '<td class="col-site">' + websiteCell(place) + '</td>';
        }

        function socialCell(place) {
            var parts = [];
            function add(label, url) {
                if (!url) return;
                parts.push('<a href="' + encodeURI(String(url)) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">' +
                    escapeHtml(label) + '</a>');
            }
            add('IG', place.instagram);
            add('FB', place.facebook);
            add('LI', place.linkedin);
            add('X', place.twitter);
            add('TT', place.tiktok);
            add('YT', place.youtube);
            add('TG', place.telegram);
            add('Pin', place.pinterest);
            if (!parts.length) return '<span class="cell-empty">—</span>';
            return parts.join(' · ');
        }

        function waCell(place) {
            var wa = place.whatsapp;
            if (!wa) return '<span class="cell-empty">—</span>';
            var digits = String(wa).replace(/[^\d+]/g, '');
            var href = digits.indexOf('+') === 0 || /^\d+$/.test(digits)
                ? 'https://wa.me/' + digits.replace(/^\+/, '')
                : (String(wa).indexOf('http') === 0 ? wa : 'https://wa.me/' + digits);
            return '<a href="' + encodeURI(href) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">' +
                escapeHtml(String(wa)) + '</a>';
        }

        function appendPlace(place, isFirst) {
            var latlng = [place.latitude, place.longitude];

            if (markersLayer) {
                L.marker(latlng).bindPopup(placePopup(place)).addTo(markersLayer);
            }

            if (!tbody) return;

            var tr = document.createElement('tr');
            tr.innerHTML = rowHtml(place);
            tr.addEventListener('click', function () {
                tbody.querySelectorAll('tr').forEach(function (r) { r.classList.remove('row-active'); });
                tr.classList.add('row-active');
                if (map) map.setView(latlng, 16);
            });
            if (isFirst) tr.classList.add('row-active');
            tbody.appendChild(tr);
        }

        function updateTitle() {
            var titleEl = document.getElementById('map-modal-title');
            if (!titleEl) return;
            var suffix = streamActive ? '（实时更新中… 已 ' + renderedCount + ' 家）' : ('（共 ' + renderedCount + ' 家）');
            titleEl.textContent = renderedCount ? ('采集结果' + suffix) : (streamActive ? '采集结果（实时更新中…）' : '采集结果');
        }

        function ensureTable() {
            var listEl = document.getElementById('job-places-list');
            if (tbody) return;
            listEl.innerHTML = '';
            var wrap = document.createElement('div');
            wrap.className = 'places-table-wrap';
            wrap.innerHTML = '<table class="places-table">' +
                '<thead><tr>' +
                '<th class="col-name">名称</th>' +
                '<th class="col-addr">地址</th>' +
                '<th class="col-wa">WhatsApp</th>' +
                '<th class="col-mail">邮箱</th>' +
                '<th class="col-phone">电话</th>' +
                '<th class="col-social">社媒</th>' +
                '<th class="col-rating">评分</th>' +
                '<th class="col-reviews">评论数</th>' +
                '<th class="col-site">网站</th>' +
                '</tr></thead><tbody></tbody></table>';
            listEl.appendChild(wrap);
            tbody = wrap.querySelector('tbody');
        }

        function renderBatch(list) {
            // CSV 只增不改，按下标增量追加即可
            for (var i = renderedCount; i < list.length; i++) {
                appendPlace(list[i], renderedCount === 0 && i === 0);
            }
            var hadNew = list.length > renderedCount;
            renderedCount = list.length;

            if (hadNew && map && markersLayer) {
                // 首次有数据时缩放到结果范围；后续追加不再打断用户视角
                if (!renderBatch._fitted) {
                    renderBatch._fitted = true;
                    try { map.fitBounds(markersLayer.getBounds(), { padding: [30, 30] }); } catch (e) {}
                }
            }
            updateTitle();
        }

        function showEmptyState() {
            var listEl = document.getElementById('job-places-list');
            listEl.innerHTML = '<p class="map-empty">该任务暂无可展示的商家数据。</p>';
            if (map) map.setView([0, 0], 2);
        }

        function stopStreaming() {
            streamActive = false;
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            updateTitle();
        }

        function pollPlaces() {
            fetch('/api/v1/jobs/' + JOB_ID + '/places')
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (list) {
                    if (!list) return;
                    if (list.length > 0) ensureTable();
                    renderBatch(list);
                })
                .catch(function () {});

            // 每 2 次轮询查一次任务状态，完成/失败即停止流式更新
            statusPollCount++;
            if (statusPollCount % 2 === 0) {
                fetch('/api/v1/jobs/' + JOB_ID)
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (job) {
                        if (job && job.Status !== 'working' && job.Status !== 'pending') {
                            // 最后再拉一次结果，然后停止
                            fetch('/api/v1/jobs/' + JOB_ID + '/places')
                                .then(function (res) { return res.ok ? res.json() : null; })
                                .then(function (list) {
                                    if (list) {
                                        if (list.length > 0) ensureTable();
                                        renderBatch(list);
                                    }
                                    stopStreaming();
                                })
                                .catch(function () { stopStreaming(); });
                        }
                    })
                    .catch(function () {});
            }
        }

        function initJobMap() {
            if (!Array.isArray(places)) places = [];

            map = createMap();
            if (!map) return;
            markersLayer = L.layerGroup().addTo(map);

            if (places.length > 0) {
                ensureTable();
                // 先落到首条坐标，避免长时间停在世界视图
                var first = places[0];
                if (first && isFinite(first.latitude) && isFinite(first.longitude)) {
                    map.setView([first.latitude, first.longitude], 13);
                }
                renderBatch(places);
                // 布局稳定后再 fit：弹窗刚插入时偶发 0 尺寸导致灰底不补瓦片
                setTimeout(function () {
                    refreshMapSize(map);
                    try {
                        if (markersLayer && markersLayer.getLayers().length) {
                            map.fitBounds(markersLayer.getBounds(), { padding: [30, 30], maxZoom: 15 });
                        } else if (first && isFinite(first.latitude) && isFinite(first.longitude)) {
                            map.setView([first.latitude, first.longitude], 14);
                        }
                    } catch (e) {}
                }, 120);
            } else if (streamActive) {
                ensureTable();
                updateTitle();
                map.setView([20, 0], 2);
            } else {
                showEmptyState();
            }

            refreshMapSize(map);

            if (streamActive) {
                // 结果是流式写入 CSV 的：轮询会看到数量逐渐增加
                pollTimer = setInterval(pollPlaces, 3000);
                pollPlaces();
            }
        }

        window.closeJobMap = function () {
            stopStreaming();

            if (window.__jobMap) {
                window.__jobMap.remove();
                window.__jobMap = null;
            }

            var container = document.getElementById('map-modal-container');
            if (container) {
                container.innerHTML = '';
            }
        };

        ensureLeaflet(initJobMap);
    })();
    </script>
</div>
