<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发开发信 · 地图获客</title>
  <link rel="stylesheet" href="/static/css/discover.css">
</head>
<body class="wmt">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  </svg>
  <header class="wmt-top">
    <a class="wmt-logo" href="/">
      <span class="wmt-logo-mark"><svg class="wmt-icon" style="color:#fff"><use href="#i-map"/></svg></span>
      地图获客
    </a>
    <nav class="wmt-tabs">
      <a href="/">地图获客</a>
      <a href="/discover">智能引擎</a>
      <a class="is-on" href="/outreach">发开发信</a>
    </nav>
    <div class="wmt-top-right">
      <a href="/api/docs">使用帮助</a>
      <span class="wmt-user"><span class="wmt-avatar"><svg class="wmt-icon"><use href="#i-user"/></svg></span>张三</span>
    </div>
  </header>
  <div class="wmt-shell">
    <aside class="wmt-side">
      <a class="wmt-item" href="/"><svg class="wmt-icon"><use href="#i-map"/></svg>地图获客</a>
      <a class="wmt-item" href="/discover"><svg class="wmt-icon"><use href="#i-spark"/></svg>智能引擎</a>
      <a class="wmt-item is-on" href="/outreach"><svg class="wmt-icon"><use href="#i-mail"/></svg>发开发信</a>
    </aside>
    <main class="wmt-main">
      <section class="wmt-results">
        <h1 class="wmt-hero-title" style="color:#1f2329;font-size:22px;margin:8px 0 12px">发开发信</h1>
        <p class="wmt-status" style="max-width:640px;line-height:1.7">
          这里用来给<strong>已经有邮箱的线索</strong>写开发信。邮箱可以来自「地图获客」抓到的商家资料，或智能引擎「营销模式」抽到的公开邮箱。
          系统只打开写信窗口，不会代发。私信模式找的是社媒主页，请回智能引擎打开官方页手动发。
        </p>
        <label for="outreach-emails" style="display:block;margin:16px 0 8px;color:#646a73">收件人邮箱</label>
        <textarea id="outreach-emails" rows="6" placeholder="多个邮箱用逗号或换行分隔" style="width:100%;max-width:640px;padding:10px 12px;border:1px solid #e6eaf0;border-radius:4px;font:inherit"></textarea>
        <div class="wmt-actions" style="margin-top:12px">
          <a id="outreach-mailto" class="btn-ghost" href="mailto:">打开系统邮箱</a>
        </div>
        <p class="wmt-empty" id="outreach-empty">可从智能引擎营销模式勾选后点「一键营销」带入邮箱，或手动粘贴。写信模块尚未群发。</p>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const emails = (params.get("emails") || "").split(/[,;\s]+/).filter(Boolean);
      const box = document.getElementById("outreach-emails");
      const link = document.getElementById("outreach-mailto");
      const empty = document.getElementById("outreach-empty");
      if (emails.length) {
        box.value = emails.join("\n");
        empty.textContent = "已带入 " + emails.length + " 个公开邮箱。打开系统邮箱后由你手动发送，系统不会代发。";
      }
      function syncMailto() {
        const list = box.value.split(/[,;\s]+/).filter(Boolean);
        link.href = "mailto:" + list.join(",");
      }
      box.addEventListener("input", syncMailto);
      syncMailto();
    })();
  </script>
</body>
</html>
