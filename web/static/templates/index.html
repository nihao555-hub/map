<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图获客 · 智能版</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.6/htmx.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <nav id="app-rail" aria-label="功能模块">
      <a class="rail-logo" href="/" title="地图获客">
        <span><i data-lucide="map-pin" class="w-5 h-5"></i></span>
      </a>
      <div class="rail-nav">
        <a class="rail-item is-active" href="/"><i data-lucide="map-pin" class="w-4 h-4"></i>地图搜索</a>
        <a class="rail-item" href="/discover"><i data-lucide="sparkles" class="w-4 h-4"></i>智能引擎</a>
        <a class="rail-item" href="/discover?tab=exhibition"><i data-lucide="calendar" class="w-4 h-4"></i>展会获客</a>
        <a class="rail-item" href="/discover?tab=customs"><i data-lucide="ship" class="w-4 h-4"></i>海关数据</a>
      </div>
    </nav>
    <div id="app-body">
    <header id="topbar">
      <div class="page-heading">地图搜索</div>
      <div class="topbar-right">
        <button type="button" class="vip-btn"><i data-lucide="crown" class="w-4 h-4"></i>升级会员</button>
        <button type="button" class="help-btn"><i data-lucide="help-circle" class="w-4 h-4"></i>使用帮助</button>
        <div class="user-box">
          <span class="avatar"><i data-lucide="user" class="w-4 h-4"></i></span>
          <span class="user-name">张三</span>
          <i data-lucide="chevron-down" class="w-3 h-3 chevron"></i>
        </div>
      </div>
    </header>

    <div id="app-shell" class="map-shell">
      <form
        id="search-form"
        hx-post="/scrape"
        hx-target="#job-list"
        hx-swap="afterbegin"
        hx-indicator="#spinner"
        hx-on::before-request="document.getElementById('error-container').innerHTML = ''; document.getElementById('map-area').classList.add('map-loading')"
        hx-on::after-request="document.getElementById('map-area').classList.remove('map-loading'); if(!event.detail.successful) { document.getElementById('error-container').innerHTML = event.detail.xhr.responseText; } else { handleScrapeSuccess(); }"
      >
        <input type="hidden" id="name" name="name" value="">
        <input type="hidden" id="zoom" name="zoom" value="15">
        <input type="hidden" id="latitude" name="latitude" value="0">
        <input type="hidden" id="longitude" name="longitude" value="0">
        <input type="hidden" id="fastmode" name="fastmode" value="">
        <input type="hidden" id="gridmode" name="gridmode" value="on">
        <input type="hidden" id="gridbbox" name="gridbbox" value="">
        <input type="hidden" id="radius" name="radius" value="10000">
        <input type="hidden" id="columns" name="columns" value="">

        <div class="map-toolbar">
          <div class="toolbar-search wide">
            <i data-lucide="map-pin" class="w-4 h-4 input-icon icon-blue"></i>
            <input type="text" id="locations" name="locations" placeholder="地点，如洛杉矶 / 深圳市南山区" autocomplete="off" />
          </div>
          <div class="toolbar-search">
            <i data-lucide="search" class="w-4 h-4 input-icon"></i>
            <input type="text" id="keywords" name="keywords" placeholder="关键词，如 coffee roaster" autocomplete="off" />
            <button type="button" class="clear-btn" id="keywords-clear" title="清除">&times;</button>
          </div>
          <div class="plat-chip-row" id="mode-chips">
            <button type="button" class="plat-chip" data-mode="quick" onclick="selectMode('quick')">快速</button>
            <button type="button" class="plat-chip" data-mode="standard" onclick="selectMode('standard')">深度</button>
            <button type="button" class="plat-chip is-on" data-mode="grid" onclick="selectMode('grid')">全域全量</button>
          </div>
          <button type="submit" id="start-btn" class="btn-primary toolbar-submit">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>搜索</span>
          </button>
          <button type="button" id="advanced-toggle" class="plat-chip" onclick="toggleAdvanced()">高级</button>
          <div id="spinner" class="spinner htmx-indicator"></div>
        </div>

        <div id="error-container" class="error-message"></div>

        <div id="advanced-options" class="map-advanced">
          <div class="adv-inner">
            <div id="columns-section" class="hidden">
              <label class="field-label-sm">结果字段</label>
              <p class="columns-note">名称 / 链接 / 经纬度 / CID / PlaceID 始终包含</p>
              <div class="columns-grid" id="columns-grid"></div>
              <div class="columns-actions">
                <button type="button" class="columns-btn" onclick="setAllColumns(true)">全选</button>
                <button type="button" class="columns-btn" onclick="setAllColumns(false)">清空</button>
                <button type="button" class="columns-btn" onclick="resetEssentialColumns()">只留必要字段</button>
              </div>
            </div>
            <div>
              <label class="field-label-sm" for="maxresults">数量上限（0=不限）</label>
              <div class="input-field">
                <input type="number" id="maxresults" name="maxresults" min="0" step="50" value="0"/>
              </div>
            </div>
            <div id="grid-density-section">
              <label class="field-label-sm" for="gridcell">网格密度</label>
              <select id="gridcell" name="gridcell" class="select-field">
                <option value="2.0">稀疏（约 2km）</option>
                <option value="1.5" selected>标准（约 1.5km）</option>
                <option value="1.0">密集（约 1km）</option>
                <option value="0.5">极密（约 500m）</option>
              </select>
            </div>
            <div class="switch-row">
              <span class="switch-label"><i data-lucide="mail" class="w-4 h-4"></i>抓取邮箱</span>
              <input type="checkbox" id="email" name="email" checked class="hidden">
              <div class="toggle-switch on" id="email-toggle" onclick="toggleSwitch(this, 'email')"></div>
            </div>
            <div>
              <label class="field-label-sm" for="lang">语言</label>
              <div class="input-field">
                <input type="text" id="lang" name="lang" value="" placeholder="自动检测"/>
              </div>
            </div>
            <div>
              <label class="field-label-sm" for="maxtime">最大运行时间</label>
              <select id="maxtime" name="maxtime" class="select-field">
                <option value="3m">3 分钟</option>
                <option value="10m">10 分钟</option>
                <option value="30m" selected>30 分钟</option>
                <option value="60m">1 小时</option>
                <option value="120m">2 小时</option>
              </select>
            </div>
            <div>
              <label class="field-label-sm" for="depth">滚动深度</label>
              <select id="depth" name="depth" class="select-field">
                <option value="5">浅（5 次）</option>
                <option value="10">标准（10 次）</option>
                <option value="20" selected>深（20 次）</option>
                <option value="50">极深（50 次）</option>
              </select>
            </div>
            <div>
              <label class="field-label-sm" for="proxies">代理（可选）</label>
              <textarea id="proxies" name="proxies" class="custom-textarea" rows="2" placeholder="每行一个代理"></textarea>
            </div>
          </div>
        </div>
      </form>

      <div class="map-body">
      <aside id="sidebar">
        <div id="sidebar-content">
          <div class="history-block">
            <div class="history-head">
              <span class="history-title"><i data-lucide="history" class="w-4 h-4"></i>搜索记录</span>
              <button type="button" class="history-clear" onclick="clearHistory()">清空</button>
            </div>
            <div id="job-list" hx-get="/jobs" hx-trigger="load, every 10s" hx-swap="innerHTML"></div>
            <div id="empty-state" class="hidden">
              <p class="empty-text">暂无搜索记录</p>
            </div>
          </div>
        </div>
      </aside>

      <main id="map-area">
        <div id="map"></div>

        <!-- 地图加载中遮罩 -->
        <div id="map-loading-mask">
          <div class="map-loading-box">
            <div class="spinner-inline"></div>
            <span>正在采集，请稍候…</span>
          </div>
        </div>

        <!-- 左上：当前区域重新搜索 -->
        <button type="button" id="research-btn" class="map-card map-card-btn">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          在当前区域重新搜索
        </button>

        <!-- 右上：热力图开关 -->
        <div id="heatmap-card" class="map-card">
          <i data-lucide="flame" class="w-4 h-4 flame-icon"></i>
          <span>显示热力图</span>
          <div class="toggle-switch" id="heatmap-toggle" onclick="toggleHeatmap(this)"></div>
        </div>

        <!-- 右下：地图控制器 -->
        <div id="map-ctrl">
          <button type="button" class="ctrl-btn" title="定位" onclick="locateMe()"><i data-lucide="locate-fixed" class="w-4 h-4"></i></button>
          <button type="button" class="ctrl-btn" title="放大" onclick="zoomMap(1)"><i data-lucide="plus" class="w-4 h-4"></i></button>
          <button type="button" class="ctrl-btn" title="缩小" onclick="zoomMap(-1)"><i data-lucide="minus" class="w-4 h-4"></i></button>
        </div>

        <!-- 底部结果栏 -->
        <div id="result-bar" class="hidden">
          <div class="result-info">
            <div class="result-title">找到 <b id="result-count">0</b> 个相关结果<span id="result-mode">（快速模式）</span></div>
            <div class="result-source">真实商户数据 · 实时采集</div>
          </div>
          <button type="button" id="result-detail-btn" class="result-detail">查看详情 <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
        </div>

        <!-- 地图选点提示 -->
        <div id="pick-tip" class="hidden"></div>
      </main>
      </div>
    </div>

    <div id="map-modal-container"></div>

    <script src="/static/js/map.js"></script>
    <script>
      // 初始化 Lucide 图标
      lucide.createIcons();



      // 结果字段定义（深度模式可勾选；系统保留字段不在此列，始终包含）
      var ALL_COLUMNS = [
        ['address', '地址', true], ['phone', '电话', true], ['emails', '邮箱', true],
        ['website', '网站', true], ['category', '类别', true], ['review_rating', '评分', true],
        ['review_count', '评论数', true], ['reviews_per_rating', '各星级评论数', false],
        ['open_hours', '营业时间', true], ['popular_times', '客流高峰', false],
        ['price_range', '价格区间', true], ['status', '营业状态', true],
        ['descriptions', '商家简介', true], ['about', '特色标签', false],
        ['menu', '菜单', false], ['owner', '店主信息', false],
        ['images', '图片', false], ['thumbnail', '缩略图', true],
        ['reviews_link', '评论链接', false], ['user_reviews', '用户评论', false],
        ['user_reviews_extended', '扩展评论', false], ['plus_code', 'Plus Code', false],
        ['timezone', '时区', true], ['complete_address', '完整地址', false],
        ['credit_cards_accepted', '信用卡支付', false], ['reservations', '预约方式', false],
        ['order_online', '在线下单', false], ['street_view_url', '街景', false],
        ['data_id', '数据ID', false]
      ];
      var ESSENTIAL_COLUMN_KEYS = ['address', 'phone', 'emails', 'website', 'review_rating', 'review_count', 'category'];

      function buildColumnsPicker() {
        var grid = document.getElementById('columns-grid');
        grid.innerHTML = '';
        ALL_COLUMNS.forEach(function (col) {
          var key = col[0], label = col[1], def = col[2];
          var item = document.createElement('label');
          item.className = 'column-chip';
          item.innerHTML = '<input type="checkbox" class="column-check" value="' + key + '"' +
            (def ? ' checked' : '') + '><span>' + label + '</span>';
          grid.appendChild(item);
        });
      }

      function setAllColumns(on) {
        document.querySelectorAll('.column-check').forEach(function (c) { c.checked = on; });
      }

      function resetEssentialColumns() {
        document.querySelectorAll('.column-check').forEach(function (c) {
          c.checked = ESSENTIAL_COLUMN_KEYS.indexOf(c.value) !== -1;
        });
      }

      function syncColumnsHidden() {
        // 快速模式：不传 columns（后端自动用必要列）；深度/网格：传用户勾选
        if (currentMode === 'quick') {
          document.getElementById('columns').value = '';
          return;
        }
        var checked = [];
        document.querySelectorAll('.column-check').forEach(function (c) {
          if (c.checked) checked.push(c.value);
        });
        // 全选时等同默认全部列，也传空让后端走全列逻辑
        if (checked.length === ALL_COLUMNS.length) {
          document.getElementById('columns').value = '';
        } else {
          document.getElementById('columns').value = checked.join(',');
        }
      }

      // 模式选择：quick=快速(fastmode) / standard=深度 / grid=全域全量
      let currentMode = 'grid';
      function selectMode(mode) {
        currentMode = mode;
        document.querySelectorAll('#mode-chips .plat-chip').forEach(function (chip) {
          chip.classList.toggle('is-on', chip.dataset.mode === mode);
        });
        document.getElementById('fastmode').value = mode === 'quick' ? 'on' : '';
        document.getElementById('gridmode').value = mode === 'grid' ? 'on' : '';
        document.getElementById('grid-density-section').classList.toggle('hidden', mode !== 'grid');
        document.getElementById('columns-section').classList.toggle('hidden', mode === 'quick');
        updateResultModeLabel();
      }

      // 热门搜索词填入
      function fillKeyword(word) {
        document.getElementById('keywords').value = word;
        document.getElementById('keywords').focus();
      }

      // 找什么清除按钮
      document.getElementById('keywords-clear').addEventListener('click', function () {
        document.getElementById('keywords').value = '';
        document.getElementById('keywords').focus();
      });

      // 高级选项折叠
      function toggleAdvanced() {
        document.getElementById('advanced-options').classList.toggle('open');
        document.getElementById('advanced-toggle').classList.toggle('is-on');
      }

      // 开关切换
      function toggleSwitch(el, inputId) {
        el.classList.toggle('on');
        const input = document.getElementById(inputId);
        if (input) input.checked = el.classList.contains('on');
      }

      // 提交前组装任务名称 + 自动推断语言
      document.getElementById('search-form').addEventListener('htmx:configRequest', function () {
        const keywords = document.getElementById('keywords').value.trim();
        const locations = document.getElementById('locations').value.trim();

        let name = '';
        if (keywords && locations) {
          name = locations + ' · ' + keywords;
        } else if (keywords) {
          name = keywords;
        } else {
          name = locations;
        }
        document.getElementById('name').value = name;

        const langInput = document.getElementById('lang');
        if (!langInput.value) {
          const hasChinese = /[\u4e00-\u9fa5]/.test(keywords + locations);
          langInput.value = hasChinese ? 'zh' : 'en';
        }

        // 组装结果字段参数
        syncColumnsHidden();
      });

      // 采集成功后的处理
      function handleScrapeSuccess() {
        document.getElementById('keywords').value = '';
        document.getElementById('locations').value = '';
        // 清空地图选点
        if (window.clearPickMarker) window.clearPickMarker();
        setTimeout(function () { lucide.createIcons(); }, 100);
        refreshRecords();
      }

      // 记录列表刷新后的统一处理
      function refreshRecords() {
        const records = document.querySelectorAll('#job-list .record-item');
        const emptyState = document.getElementById('empty-state');
        emptyState.classList.toggle('hidden', records.length > 0);
        lucide.createIcons();
        // 同步地图与结果栏（由 map.js 提供）
        if (window.syncMapWithRecords) window.syncMapWithRecords();
      }

      // 清空记录
      function clearHistory() {
        const records = document.querySelectorAll('#job-list .record-item');
        if (records.length === 0) return;
        if (!confirm('确定要清空全部搜索记录吗？')) return;
        records.forEach(function (el) {
          fetch('/delete?id=' + encodeURIComponent(el.dataset.jobId), { method: 'DELETE' });
        });
        setTimeout(function () { htmx.trigger('#job-list', 'load'); }, 500);
      }

      // 结果栏模式文案
      function updateResultModeLabel() {
        const label = { quick: '快速模式', standard: '深度模式', grid: '全域全量模式' }[currentMode] || '快速模式';
        document.getElementById('result-mode').textContent = '（' + label + '）';
      }

      // HTMX 加载完成后处理记录列表
      document.body.addEventListener('htmx:afterOnLoad', function (event) {
        if (event.detail.elt.id === 'job-list') {
          refreshRecords();
        }
      });

      // 记录行点击删除后刷新（htmx 删除行）
      document.body.addEventListener('htmx:afterRequest', function (event) {
        if (event.detail.elt.classList && event.detail.elt.classList.contains('record-del')) {
          setTimeout(refreshRecords, 300);
        }
      });

      // 构建结果字段选择器（脚本末尾执行，确保 ALL_COLUMNS 已就绪；
      // 默认全域全量模式 -> 展示自选区）
      buildColumnsPicker();
      document.getElementById('columns-section').classList.remove('hidden');
    </script>
    </div>
</body>
</html>
