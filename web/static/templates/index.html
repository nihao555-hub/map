<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图商家采集</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.6/htmx.min.js"></script>
</head>
<body>
    <main class="page-shell">
        <div id="stats-container"
             hx-get="/stats"
             hx-trigger="load, every 15s"
             hx-swap="innerHTML"></div>

        <div class="workspace">
            <aside class="control-column">
        <section class="hero-card">
            <div class="hero-copy">
                <span class="eyebrow">Google Maps 商家采集</span>
                <h1>找到你想要的本地商家</h1>
                <p>输入行业和地点，剩下的交给我们。无需了解复杂设置。</p>
            </div>

            <div id="success-container" class="success-message" role="status" aria-live="polite"></div>
            <div id="error-container" class="error-message" role="alert"></div>

            <form id="scrape-form"
                  hx-post="/scrape"
                  hx-target="#job-list"
                  hx-swap="afterbegin"
                  hx-indicator="#spinner"
                  hx-on::config-request="configureScrape(event)"
                  hx-on::after-request="finishScrape(event)">
                <div class="primary-fields">
                    <div class="form-group">
                        <label for="business-type">找什么</label>
                        <input id="business-type" type="text" placeholder="例如：咖啡店" list="business-suggestions" autocomplete="off" required>
                        <datalist id="business-suggestions">
                            <option value="咖啡店"></option>
                            <option value="餐厅"></option>
                            <option value="酒店"></option>
                            <option value="牙科诊所"></option>
                            <option value="健身房"></option>
                            <option value="美容院"></option>
                            <option value="汽车修理"></option>
                            <option value="律师事务所"></option>
                            <option value="房产中介"></option>
                            <option value="超市"></option>
                        </datalist>
                        <div class="quick-picks" aria-label="常用类型">
                            <button type="button" class="chip" data-value="咖啡店">咖啡店</button>
                            <button type="button" class="chip" data-value="餐厅">餐厅</button>
                            <button type="button" class="chip" data-value="酒店">酒店</button>
                            <button type="button" class="chip" data-value="牙科诊所">牙科诊所</button>
                            <button type="button" class="chip" data-value="健身房">健身房</button>
                            <button type="button" class="chip" data-value="美容院">美容院</button>
                            <button type="button" class="chip" data-value="汽车修理">汽车修理</button>
                            <button type="button" class="chip" data-value="律师事务所">律师事务所</button>
                            <button type="button" class="chip" data-value="房产中介">房产中介</button>
                            <button type="button" class="chip" data-value="超市">超市</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="location">在哪里</label>
                        <input id="location" type="text" placeholder="深圳南山 / Athens Greece" autocomplete="address-level2">
                    </div>
                </div>

                <div id="batch-preview" class="batch-preview" aria-live="polite"></div>

                <fieldset class="quantity-picker">
                    <legend>抓取数量</legend>
                    <div class="segmented-control">
                        <label><input type="radio" name="quantity" data-depth="1" checked><span>少量（快）<small>约 1 分钟</small></span></label>
                        <label><input type="radio" name="quantity" data-depth="5"><span>中等<small>约 1–3 分钟</small></span></label>
                        <label><input type="radio" name="quantity" data-depth="10"><span>大量（慢）<small>约 3–5 分钟</small></span></label>
                    </div>
                </fieldset>

                <details class="advanced-options">
                    <summary>高级选项</summary>
                    <div class="advanced-grid">
                        <div class="form-group">
                            <label for="advanced-lang">语言代码</label>
                            <input id="advanced-lang" type="text" placeholder="自动识别（en 或 zh）">
                        </div>
                        <div class="form-group checkbox-group">
                            <label><input id="advanced-email" type="checkbox" checked> 抓取邮箱</label>
                            <small>会访问商家官网找邮箱，速度会更慢</small>
                        </div>
                        <div class="form-group checkbox-group">
                            <label><input id="advanced-fastmode" type="checkbox"> 快速模式</label>
                            <small>适合快速查看附近少量结果</small>
                        </div>
                        <div class="form-group">
                            <label for="advanced-zoom">地图缩放级别</label>
                            <input id="advanced-zoom" type="number" value="15" min="0" max="21">
                        </div>
                        <div class="form-group">
                            <label for="advanced-latitude">纬度</label>
                            <input id="advanced-latitude" type="number" value="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="advanced-longitude">经度</label>
                            <input id="advanced-longitude" type="number" value="0" step="any">
                        </div>
                        <div class="form-group">
                            <label for="advanced-radius">搜索半径（米）</label>
                            <input id="advanced-radius" type="number" value="10000" min="0">
                        </div>
                        <div class="form-group">
                            <label for="advanced-maxtime">最长运行时间</label>
                            <input id="advanced-maxtime" type="text" value="10m" placeholder="例如 10m">
                        </div>
                    </div>
                    <div class="form-group manual-query">
                        <label for="manual-keywords">手动编辑搜索词</label>
                        <textarea id="manual-keywords" rows="4" placeholder="每行一个搜索词；填写后将覆盖上面的行业和地点组合"></textarea>
                        <small>填写此处后，将优先使用手动搜索词。</small>
                    </div>
                    <div class="form-group">
                        <label for="advanced-proxies">代理（每行一个）</label>
                        <textarea id="advanced-proxies" rows="3" placeholder="HTTPS 代理：https://username:password@myproxy.local:443&#10;HTTP 代理：http://username:password@myproxy.local:443&#10;SOCKS5 代理：socks5://127.0.0.1:8000"></textarea>
                    </div>
                </details>

                <button id="submit-button" class="primary-button" type="submit" disabled>
                    开始抓取 <span aria-hidden="true">→</span>
                </button>
                <div id="spinner" class="spinner" aria-hidden="true"></div>
            </form>
        </section>
            </aside>
            <section class="results-column">
                <div id="job-list" class="job-list" hx-get="/jobs" hx-trigger="load, every 15s" hx-swap="innerHTML"></div>
                <div id="results-container" aria-live="polite"></div>
            </section>
        </div>
    </main>
<script>
(function () {
    const businessType = document.getElementById('business-type');
    const location = document.getElementById('location');
    const submitButton = document.getElementById('submit-button');
    const manualKeywords = document.getElementById('manual-keywords');

    function splitTypes(value) {
        return value.split(/[,，、;；\n]+|\s+-\s+/).map(function (item) {
            return item.trim();
        }).filter(Boolean);
    }

    function inferredLanguage() {
        return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(businessType.value + location.value) ? 'zh' : 'en';
    }

    function setSubmitState() {
        submitButton.disabled = !businessType.value.trim();
    }

    function composeKeywords() {
        if (manualKeywords.value.trim()) {
            return manualKeywords.value.trim();
        }
        const places = splitTypes(location.value);
        const types = splitTypes(businessType.value);
        return types.flatMap(function (type) {
            return places.length ? places.map(function (place) {
                return type + ' in ' + place;
            }) : [type];
        }).join('\n');
    }

    function previewBatch() {
        const queries = composeKeywords().split('\n').filter(Boolean);
        const preview = document.getElementById('batch-preview');
        if (!queries.length) {
            preview.textContent = '';
            return;
        }
        preview.innerHTML = '<strong>将创建 ' + queries.length + ' 个搜索词</strong><br>' +
            queries.slice(0, 4).join(' · ') + (queries.length > 4 ? ' · …' : '');
    }

    window.configureScrape = function (event) {
        const depth = document.querySelector('input[data-depth]:checked').dataset.depth;
        delete event.detail.parameters.quantity;
        const queryCount = composeKeywords().split('\n').filter(Boolean).length;
        if (queryCount > 50 && !window.confirm('本次将创建 ' + queryCount + ' 个搜索词，可能耗时较长。确定继续吗？')) {
            event.preventDefault();
            return;
        }
        const title = businessType.value.trim() + (location.value.trim() ? ' · ' + location.value.trim() : '');
        event.detail.parameters.name = title;
        event.detail.parameters.keywords = composeKeywords();
        if (!manualKeywords.value.trim()) {
            event.detail.parameters.business_types = businessType.value;
            event.detail.parameters.locations = location.value;
        }
        event.detail.parameters.lang = document.getElementById('advanced-lang').value.trim() || inferredLanguage();
        event.detail.parameters.zoom = document.getElementById('advanced-zoom').value || '15';
        event.detail.parameters.latitude = document.getElementById('advanced-latitude').value || '0';
        event.detail.parameters.longitude = document.getElementById('advanced-longitude').value || '0';
        event.detail.parameters.radius = document.getElementById('advanced-radius').value || '10000';
        event.detail.parameters.fastmode = document.getElementById('advanced-fastmode').checked ? 'on' : '';
        event.detail.parameters.email = document.getElementById('advanced-email').checked ? 'on' : '';
        event.detail.parameters.depth = depth;
        event.detail.parameters.maxtime = document.getElementById('advanced-maxtime').value || '10m';
        event.detail.parameters.proxies = document.getElementById('advanced-proxies').value;
        document.getElementById('error-container').innerHTML = '';
        document.getElementById('success-container').innerHTML = '';
    };

    window.finishScrape = function (event) {
        if (event.detail.successful) {
            document.getElementById('success-container').textContent = '任务已开始，抓取中… 通常需要 1-5 分钟';
            window.setTimeout(function () {
                document.getElementById('success-container').textContent = '';
            }, 8000);
            document.getElementById('scrape-form').reset();
            document.getElementById('advanced-lang').value = '';
            setSubmitState();
        } else {
            document.getElementById('error-container').textContent = event.detail.xhr.responseText;
        }
    };

    [businessType, location].forEach(function (input) {
        input.addEventListener('input', function () {
            setSubmitState();
            previewBatch();
        });
    });
    document.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
            businessType.value = chip.dataset.value;
            businessType.focus();
            setSubmitState();
            previewBatch();
        });
    });
    setSubmitState();
    previewBatch();
})();
</script>
</body>
</html>
