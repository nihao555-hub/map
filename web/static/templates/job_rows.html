{{range .}}
<div class="record-item status-{{.Status}}" data-job-id="{{.ID}}" data-ts="{{.Date.Unix}}" data-status="{{.Status}}" data-lat="{{.Data.Lat}}" data-lon="{{.Data.Lon}}" onclick="selectRecord(this)">
  <div class="record-main">
    <div class="record-name">{{.Name}}</div>
    {{ if eq .Status "working" }}<div class="record-progress">采集中…</div>
    {{ else if eq .Status "pending" }}<div class="record-progress">待启动…</div>
    {{ else if eq .Status "failed" }}<div class="record-failed">采集失败</div>{{ end }}
  </div>
  <div class="record-side">
    <span class="mode-tag tag-grid">深度全量</span>
    <span class="record-time">{{.Date.Format "01-02 15:04"}}</span>
    {{ if eq .Status "ok" }}
    <a class="record-csv" href="/download?id={{.ID}}" download title="导出 CSV"
       onclick="event.stopPropagation()">CSV</a>
    {{ end }}
    <button type="button" class="record-del" title="删除记录" onclick="event.stopPropagation()"
            hx-delete="/delete?id={{.ID}}"
            hx-target="closest .record-item"
            hx-swap="outerHTML swap:0.2s"
            hx-confirm="确定要删除这条记录吗？">&times;</button>
  </div>
</div>
{{end}}
