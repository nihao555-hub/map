<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能引擎搜索 · 地图获客</title>
  <link rel="stylesheet" href="/static/css/discover.css">
</head>
<body class="wmt" data-tab="people">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-tick" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12.5 10 17l9-10"/></symbol>
  </svg>

  <header class="wmt-top">
    <a class="wmt-logo" href="/">
      <span class="wmt-logo-mark"><svg class="wmt-icon" style="color:#fff"><use href="#i-map"/></svg></span>
      地图获客
    </a>
    <nav class="wmt-tabs" aria-label="功能模块">
      <a href="/">地图获客</a>
      <a class="is-on" href="/discover">智能引擎</a>
      <a href="/outreach">发开发信</a>
    </nav>
    <div class="wmt-top-right">
      <a href="/api/docs">使用帮助</a>
      <span class="wmt-user"><span class="wmt-avatar"><svg class="wmt-icon"><use href="#i-user"/></svg></span>张三</span>
    </div>
  </header>

  <div class="wmt-shell">
    <aside class="wmt-side" aria-label="本项目模块">
      <a class="wmt-item" href="/"><svg class="wmt-icon"><use href="#i-map"/></svg>地图获客</a>
      <a class="wmt-item is-on" href="/discover"><svg class="wmt-icon"><use href="#i-spark"/></svg>智能引擎</a>
      <a class="wmt-item" href="/outreach"><svg class="wmt-icon"><use href="#i-mail"/></svg>发开发信</a>
    </aside>

    <main class="wmt-main">
      <section id="landing">
        <div class="wmt-hero">
          <h1 class="wmt-hero-title" id="discover-title">智能引擎搜索</h1>
          <div class="wmt-channel" id="mode-group-landing" role="tablist" aria-label="搜索模式">
            <button type="button" class="is-on" data-mode="homepage">私信模式</button>
            <button type="button" data-mode="marketing">营销模式</button>
          </div>
          <ul class="wmt-bullets" id="mode-bullets">
            <li><span class="wmt-check"><svg class="wmt-icon" style="width:10px;height:10px"><use href="#i-tick"/></svg></span>不是地图搜店：输入商品或企业关键词</li>
            <li><span class="wmt-check"><svg class="wmt-icon" style="width:10px;height:10px"><use href="#i-tick"/></svg></span>在抖音、TikTok 等社媒找店主 / 真人主页</li>
            <li><span class="wmt-check"><svg class="wmt-icon" style="width:10px;height:10px"><use href="#i-tick"/></svg></span>拿到的是可打开的官方主页，不是邮箱</li>
            <li><span class="wmt-check"><svg class="wmt-icon" style="width:10px;height:10px"><use href="#i-tick"/></svg></span>去私信：在右侧打开主页预览，系统不代发</li>
          </ul>
          <div class="wmt-channel" id="channel-group-landing" hidden>
            <button type="button" class="is-on" data-channel="email">邮箱</button>
            <button type="button" data-channel="whatsapp">WhatsApp</button>
          </div>
          <form id="landing-form" class="wmt-search-row">
            <div class="wmt-searchbox">
              <svg class="wmt-icon" style="color:#8f959e"><use href="#i-search"/></svg>
              <input type="text" id="keyword-landing" placeholder="请输入商品或企业名称，如 电动工具 / power tools" required />
              <button type="submit" class="wmt-search-btn" id="landing-btn">搜索</button>
            </div>
          </form>
          <div class="wmt-hero-plats" id="platform-group-landing"></div>
        </div>
      </section>

      <section id="results-view" class="wmt-results hidden">
        <div class="wmt-crumb">智能引擎 &gt; <b id="results-crumb">社媒主页</b></div>
        <form id="discover-form" class="wmt-results-head">
          <div class="wmt-channel" id="mode-group" role="tablist" aria-label="搜索模式">
            <button type="button" class="is-on" data-mode="homepage">私信模式</button>
            <button type="button" data-mode="marketing">营销模式</button>
          </div>
          <div class="wmt-searchbox">
            <svg class="wmt-icon" style="color:#8f959e"><use href="#i-search"/></svg>
            <input type="text" id="keyword" name="keyword" placeholder="请输入企业或商品名称" required />
            <button type="submit" class="wmt-search-btn" id="discover-btn">搜索</button>
          </div>
          <div class="wmt-channel" id="channel-group" hidden>
            <button type="button" class="is-on" data-channel="email">邮箱</button>
            <button type="button" data-channel="whatsapp">WhatsApp</button>
          </div>
          <input type="hidden" id="limit" name="limit" value="0">
        </form>
        <div class="wmt-plat-list" id="platform-group"></div>
        <div id="discover-status" class="wmt-status">输入关键词后检索公开社媒主页</div>
        <div id="discover-warnings" class="wmt-warn hidden"></div>
        <div class="wmt-actions" id="result-toolbar">
          <div class="wmt-actions" id="market-actions" hidden>
            <button type="button" class="btn-ghost" id="select-all">全选</button>
            <button type="button" class="btn-ghost" id="market-btn">一键营销</button>
          </div>
          <div class="wmt-pager" id="pager" hidden>
            <span id="hit-count">共 0 条</span>
            <button type="button" id="page-prev" aria-label="上一页">&lt;</button>
            <span id="page-cur">1</span>
            <span class="wmt-pager-sep">/</span>
            <span id="page-total">1</span>
            <button type="button" id="page-next" aria-label="下一页">&gt;</button>
          </div>
        </div>
        <div class="wmt-workbench">
          <div class="wmt-table-wrap">
            <table class="wmt-table" id="discover-table">
              <thead id="discover-thead">
                <tr>
                  <th>名称</th>
                  <th style="width:130px">平台</th>
                  <th style="width:180px">账号</th>
                  <th>主页</th>
                  <th style="width:160px">操作</th>
                </tr>
              </thead>
              <tbody id="discover-results"></tbody>
            </table>
            <div id="discover-empty" class="wmt-empty">暂无结果。请输入企业或商品名称后搜索。</div>
          </div>
          <aside id="preview-pane" class="wmt-preview" aria-label="主页预览">
            <div id="preview-empty" class="wmt-preview-empty">点击左侧「打开主页」或「去私信」，在这里查看主页并写草稿。系统不会代发。</div>
            <div id="preview-card" class="hidden">
              <header class="wmt-preview-head">
                <div>
                  <div class="wmt-preview-kicker" id="preview-kicker">主页预览</div>
                  <h2 id="preview-name">—</h2>
                </div>
                <button type="button" class="btn-ghost" id="preview-close">关闭</button>
              </header>
              <p class="wmt-preview-desc" id="preview-desc"></p>
              <img id="preview-image" class="wmt-preview-img hidden" alt="">
              <iframe id="preview-frame" class="wmt-preview-frame hidden" title="官方主页" referrerpolicy="no-referrer-when-downgrade"></iframe>
              <p class="wmt-preview-note" id="preview-note"></p>
              <label class="wmt-preview-label" for="preview-to" id="preview-to-label">收件人</label>
              <input id="preview-to" class="wmt-preview-input" placeholder="邮箱或 WhatsApp">
              <label class="wmt-preview-label" for="preview-draft">草稿（只存在本页，不会发出）</label>
              <textarea id="preview-draft" class="wmt-preview-draft" rows="6" placeholder="在这里写私信或开发信草稿，再到官方页 / 系统邮箱手动发送。"></textarea>
              <div class="wmt-actions">
                <button type="button" class="btn-ghost" id="preview-open-official">在官方页打开</button>
                <button type="button" class="btn-ghost" id="preview-copy">复制草稿</button>
              </div>
            </div>
          </aside>
        </div>
        <div id="discover-foot" class="wmt-pageinfo" style="margin:12px 0 0;justify-content:flex-start"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="wmt-toast hidden"></div>
  <script src="/static/js/discover.js"></script>
</body>
</html>
