<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能引擎搜索 · 地图获客</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/discover.css">
</head>
<body data-tab="{{.Tab}}">
  <nav id="app-rail" aria-label="功能模块">
    <a class="rail-logo" href="/" title="地图获客">
      <span><i data-lucide="map-pin" class="w-5 h-5"></i></span>
    </a>
    <div class="rail-nav">
      <a class="rail-item" href="/"><i data-lucide="map-pin" class="w-4 h-4"></i>地图搜索</a>
      <a class="rail-item" data-nav="people" href="/discover"><i data-lucide="sparkles" class="w-4 h-4"></i>智能引擎</a>
      <a class="rail-item" data-nav="exhibition" href="/discover?tab=exhibition"><i data-lucide="calendar" class="w-4 h-4"></i>展会获客</a>
      <a class="rail-item" data-nav="customs" href="/discover?tab=customs"><i data-lucide="ship" class="w-4 h-4"></i>海关数据</a>
    </div>
  </nav>

  <div id="app-body">
    <header id="topbar">
      <div class="page-heading" id="discover-title">智能引擎搜索</div>
      <div class="topbar-right">
        <button type="button" class="vip-btn"><i data-lucide="crown" class="w-4 h-4"></i>升级会员</button>
        <a class="help-btn" href="/api/docs" style="text-decoration:none"><i data-lucide="help-circle" class="w-4 h-4"></i>使用帮助</a>
        <div class="user-box">
          <span class="avatar"><i data-lucide="user" class="w-4 h-4"></i></span>
          <span class="user-name">张三</span>
        </div>
      </div>
    </header>

    <div id="discover-workspace">
      <form id="discover-form" class="discover-toolbar">
        <div class="toolbar-search">
          <i data-lucide="search" class="w-4 h-4 input-icon"></i>
          <input type="text" id="keyword" name="keyword" placeholder="请输入企业或商品名称，如 power tools" required />
        </div>
        <div class="plat-chip-row" id="platform-group">
          <button type="button" class="plat-chip is-on" data-platform="facebook">Facebook</button>
          <button type="button" class="plat-chip is-on" data-platform="linkedin">LinkedIn</button>
          <button type="button" class="plat-chip is-on" data-platform="instagram">Instagram</button>
          <button type="button" class="plat-chip is-on" data-platform="youtube">YouTube</button>
          <button type="button" class="plat-chip is-on" data-platform="tiktok">TikTok</button>
          <button type="button" class="plat-chip" data-platform="x">X</button>
          <button type="button" class="plat-chip" data-platform="pinterest">Pinterest</button>
          <button type="button" class="plat-chip" data-platform="threads">Threads</button>
          <button type="button" class="plat-chip" data-platform="douyin">抖音</button>
        </div>
        <input type="hidden" id="limit" name="limit" value="20">
        <button type="submit" class="btn-primary toolbar-submit" id="discover-btn">搜索</button>
        <span class="toolbar-hint">不代发私信，仅打开官方主页</span>
      </form>

      <div class="discover-table-wrap">
        <div id="discover-status" class="discover-status">输入关键词后从 Facebook / LinkedIn / Instagram / YouTube / TikTok 等海外社媒检索公开主页</div>
        <div id="discover-warnings" class="discover-warnings hidden"></div>
        <table class="discover-table" id="discover-table">
          <thead>
            <tr>
              <th style="width:36px"></th>
              <th>名称</th>
              <th style="width:110px">平台</th>
              <th style="width:180px">账号</th>
              <th>主页</th>
              <th>简介</th>
              <th style="width:160px">操作</th>
            </tr>
          </thead>
          <tbody id="discover-results"></tbody>
        </table>
        <div id="discover-empty" class="discover-empty">暂无结果。请输入企业或商品名称后搜索。</div>
        <div id="discover-foot" class="discover-foot hidden"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/discover.js"></script>
</body>
</html>
