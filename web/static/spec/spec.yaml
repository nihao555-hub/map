openapi: 3.0.3
info:
  title: Google Maps Scraper API
  version: 1.0.0
  description: API for managing job google maps scraping tasks

paths:
  /api/v1/jobs:
    post:
      summary: Create a new job scraping task
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST "http://localhost:8080/api/v1/jobs" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Coffee shops Ilion",
                "keywords": ["coffee in ilion"],
                "lang": "el",
                "zoom": 15,
                "depth": 1,
                "max_time": 3600
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiScrapeRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiScrapeResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    get:
      summary: Get all jobs
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}:
    get:
      summary: Get a specific job
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs/6f0c1af8-3c4e-4742-84bb-590938ae8930"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      summary: Delete a specific job
      x-code-samples:
        - lang: curl
          source: |
            curl -X DELETE "http://localhost:8080/api/v1/jobs/455a6a00-cefb-4a9d-9e7d-791f01873700"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted successfully
        '422':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}/download:
    get:
      summary: Download job results as CSV
      x-code-samples:
          source: |
            curl -X GET "http://localhost:8080/api/v1/jobs/18eafda3-53a9-4970-ac96-8f8dfc7011c3/download" --output results.csv
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '422':
          description: Invalid ID
        '500':
          description: Internal server error

  /api/v1/outreach/campaigns:
    get:
      summary: List outreach campaigns with delivery statistics
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutreachCampaign'
    post:
      summary: Create an outreach campaign from a completed map job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, job_id, value_proposition]
              properties:
                name:
                  type: string
                job_id:
                  type: string
                  format: uuid
                value_proposition:
                  type: string
                  example: help dental clinics turn more website visitors into booked appointments
                proof:
                  type: string
                  description: Optional, verifiable evidence only
                call_to_action:
                  type: string
                  example: Would a quick 10-minute conversation be useful?
                start:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Campaign created and contacts imported
        '422':
          description: Invalid job or no valid emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/outreach/campaigns/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get an outreach campaign and its contacts
      responses:
        '200':
          description: Campaign details
        '404':
          description: Campaign not found
    delete:
      summary: Delete a campaign and all local message state
      responses:
        '204':
          description: Campaign deleted

  /api/v1/outreach/overview:
    get:
      summary: Dashboard aggregates across all campaigns
      description: >
        Totals (campaigns, contacts, sent, replied, bounced, unsubscribed,
        high-intent, suppressed) plus mailbox/AI health and today's send quota.
      responses:
        '200':
          description: Overview payload

  /api/v1/outreach/contacts:
    get:
      summary: List contacts across campaigns for the workspace
      parameters:
        - name: campaign
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, replied, bounced, unsubscribed, completed, failed]
        - name: q
          in: query
          description: Search in name, email, category and city
          schema: { type: string }
      responses:
        '200':
          description: Contacts with intent assessment and last activity

  /api/v1/outreach/contacts/{id}:
    get:
      summary: Get one contact with its full send/receive history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Contact, campaign name, intent, and messages oldest first
        '404':
          description: Contact not found

  /api/v1/outreach/contacts/{id}/suggest:
    post:
      summary: Draft an AI reply to the contact's latest response (human review required)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Suggested reply text
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion: { type: string }
        '422':
          description: AI not configured or the contact has no reply yet

  /api/v1/outreach/settings:
    get:
      summary: Get redacted mailbox and sending settings
      responses:
        '200':
          description: Settings (authorization code is never returned)
    post:
      summary: Save mailbox and sending settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutreachSettings'
      responses:
        '204':
          description: Settings saved

  /api/v1/outreach/tick:
    post:
      summary: Check replies and send at most one due message
      responses:
        '200':
          description: Idempotent tick result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachTickReport'

  /api/v1/outreach/reply:
    post:
      summary: Send a human-approved reply in the existing email thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id, body]
              properties:
                contact_id:
                  type: integer
                  format: int64
                body:
                  type: string
      responses:
        '201':
          description: Reply sent and recorded

components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    ApiScrapeRequest:
      type: object
      properties:
        name:
          type: string
        keywords:
          type: array
          items:
            type: string
        lang:
          type: string
        zoom:
          type: integer
        lat:
          type: string
        lon:
          type: string
        fast_mode:
          type: boolean
        radius:
          type: integer
        depth:
          type: integer
        email:
          type: boolean
        max_time:
          type: integer
        proxies:
          type: array
          items:
            type: string

    ApiScrapeResponse:
      type: object
      properties:
        id:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date-time
        status:
          type: string
        data:
          $ref: '#/components/schemas/JobData'

    JobData:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
        lang:
          type: string
        zoom:
          type: integer
        lat:
          type: string
        lon:
          type: string
        fast_mode:
          type: boolean
        radius:
          type: integer
        depth:
          type: integer
        email:
          type: boolean
        max_time:
          type: integer
        proxies:
          type: array
          items:
            type: string

    OutreachCampaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, active, paused, done]
        job_id:
          type: string
          format: uuid
        value_proposition:
          type: string
        proof:
          type: string
        call_to_action:
          type: string
        sequence:
          type: array
          items:
            type: object
            properties:
              subject:
                type: string
              body:
                type: string
              delay_days:
                type: integer
        stats:
          type: object
          properties:
            contacts:
              type: integer
            sent:
              type: integer
            replied:
              type: integer
            bounced:
              type: integer
            unsubscribed:
              type: integer

    OutreachSettings:
      type: object
      properties:
        smtp_host:
          type: string
        smtp_port:
          type: integer
        smtp_tls:
          type: string
          enum: [ssl, starttls]
        imap_host:
          type: string
        imap_port:
          type: integer
        email_address:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Held in memory only; prefer OUTREACH_SMTP_PASSWORD
        from_name:
          type: string
        sender_company:
          type: string
        send_start_hour:
          type: integer
        send_end_hour:
          type: integer
        send_days:
          type: string
          example: "234"
        daily_cap:
          type: integer
        warmup_start:
          type: integer
        warmup_step:
          type: integer
        min_gap_seconds:
          type: integer
        max_gap_seconds:
          type: integer
        default_timezone:
          type: string
        ai_base_url:
          type: string
          description: OpenAI-compatible endpoint base URL (DeepSeek/Qwen/Kimi/OpenAI/Ollama)
          example: https://api.deepseek.com/v1
        ai_model:
          type: string
          example: deepseek-chat
        ai_api_key:
          type: string
          format: password
          description: Held in memory only; prefer OUTREACH_AI_API_KEY

    OutreachTickReport:
      type: object
      properties:
        inbox_checked:
          type: integer
        replies:
          type: integer
        bounces:
          type: integer
        unsubscribed:
          type: integer
        sent:
          type: integer
        state:
          type: string

